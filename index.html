<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeKid - Emergencia y Localización</title>
    <style>
        :root {
            --primary-color: #ff3b30;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; background: var(--card-bg); padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { text-align: center; font-size: 1.8rem; margin-bottom: 8px; color: var(--primary-color); }
        p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 1rem; }
        button { padding: 12px 20px; border-radius: 8px; border: none; background: var(--primary-color); color: white; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:active { transform: scale(0.98); }
        .hidden { display: none !important; }
        .profile-card { background: #0f172a; padding: 16px; border-radius: 12px; margin-top: 16px; border: 1px solid #334155; }
        .profile-card h3 { color: var(--accent); margin-bottom: 12px; }
        .info-row { margin-bottom: 8px; font-size: 0.95rem; }
        .btn-action { display: block; width: 100%; text-align: center; padding: 12px; margin-top: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; background: #22c55e; color: white; }
        .btn-secondary { background: #3b82f6; margin-top: 8px; }
        .error-msg { color: #f87171; text-align: center; margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>SafeKid</h1>
    <p class="subtitle">Sistema de Identificación y Emergencia Infantil</p>

    <div class="search-box">
        <input type="text" id="childIdInput" placeholder="Ingresa ID del niño (ej. 007)">
        <button onclick="buscarPerfil()">Buscar</button>
    </div>

    <div id="errorMsg" class="error-msg hidden">No se encontró ningún registro con ese ID.</div>

    <div id="resultContainer" class="profile-card hidden">
        <h3 id="nombreChild"></h3>
        <div class="info-row"><strong>Edad:</strong> <span id="edadChild"></span> años</div>
        <div class="info-row"><strong>Tutor:</strong> <span id="tutorChild"></span></div>
        <div class="info-row"><strong>Alergias / Médico:</strong> <span id="infoMedica"></span></div>

        <a id="btnLlamar" href="#" class="btn-action">Llamar al Tutor / Emergencia</a>
        <a id="btnUbicacion" href="#" class="btn-action btn-secondary" target="_blank">Enviar Ubicación por WhatsApp</a>
    </div>
</div>

<script>
    const BIN_ID = "6af90c83ac6210605a887415";
    const MASTER_KEY = "$2a$10$RA2b3dfFoTrdqkpHH7uVkedzDc3OSmOTSLuvKFx7n4hRCONPqti9S";

    async function buscarPerfil() {
        const inputVal = document.getElementById("childIdInput").value.trim();
        const errorDiv = document.getElementById("errorMsg");
        const resultCard = document.getElementById("resultContainer");

        errorDiv.classList.add("hidden");
        resultCard.classList.add("hidden");

        if (!inputVal) return;

        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: {
                    "X-Master-Key": MASTER_KEY
                }
            });

            if (!response.ok) throw new Error("Error al conectar con la base de datos");

            const data = await response.json();
            const registros = data.record.children || data.record;

            const encontrado = registros.find(c => String(c.id).trim() === inputVal);

            if (encontrado) {
                document.getElementById("nombreChild").innerText = encontrado.nombre;
                document.getElementById("edadChild").innerText = encontrado.edad;
                document.getElementById("tutorChild").innerText = encontrado.tutor;
                document.getElementById("infoMedica").innerText = encontrado.medico || "Ninguna registrada";

                document.getElementById("btnLlamar").href = `tel:${encontrado.telefono}`;
                document.getElementById("btnUbicacion").href = `https://wa.me/${encontrado.telefono}?text=¡Emergencia! Encontré al niño con ID ${encontrado.id}`;

                resultCard.classList.remove("hidden");
            } else {
                errorDiv.classList.remove("hidden");
                errorDiv.innerText = "No se encontró ningún registro con ese ID.";
            }
        } catch (error) {
            console.error(error);
            errorDiv.innerText = "Error de red al consultar el registro.";
            errorDiv.classList.remove("hidden");
        }
    }
</script>

</body>
</html>
